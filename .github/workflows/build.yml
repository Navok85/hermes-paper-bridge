name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build jar
        run: mvn -B package

      - name: Package zip
        run: |
          jar=$(basename target/hermes-chat-*.jar)
          version=${jar#hermes-chat-}
          version=${version%.jar}
          cd target && zip -j "hermes-paper-bridge-${version}.zip" "$jar"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-paper-bridge
          path: target/hermes-paper-bridge-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermes-paper-bridge
      - name: Create GitHub release with zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" hermes-paper-bridge-*.zip --generate-notes
