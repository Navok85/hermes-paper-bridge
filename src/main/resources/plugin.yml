name: HermesChat
version: '${project.version}'
main: de.navok.hermeschat.HermesChatPlugin
api-version: '26.3'
description: Chat with your Hermes agent directly from Minecraft
author: navok

commands:
  hermes:
    description: Ask your Hermes agent
    usage: /hermes <question> | /hermes reset
    aliases: [h]

permissions:
  hermes.chat:
    description: Allows sending questions to Hermes
    default: op
  hermes.reset:
    description: Allows resetting the Hermes conversation
    default: op
