# Language for chat and console messages: en or de
language: en

# Hermes API server (set API_SERVER_ENABLED=true and API_SERVER_KEY in ~/.hermes/.env)
base-url: http://127.0.0.1:8642/v1
# Required: same value as API_SERVER_KEY. Empty = plugin stays disabled.
api-key: ""

# Model name; without a matching 'provider', Hermes uses its gateway default
model: hermes-agent

# Timeout per request in seconds
timeout-seconds: 300

# Maximum answer length in chat
max-chars: 1500

# Minimum delay between two questions per player in seconds (0 = off)
cooldown-seconds: 10

# While a request runs, remind the asker every N seconds that Hermes is still working (0 = off)
still-thinking-interval-seconds: 0

# true: answer goes to all players, false: only to the player who asked
broadcast: false

# Prefix of the Hermes session ID (mc-<uuid>)
session-prefix: mc-
